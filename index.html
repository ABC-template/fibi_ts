<!DOCTYPE html> 
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="color-scheme" content="dark">
    <title>FIBI</title>
    <!-- ==========================================
         ✅ КРИТИЧЕСКИЕ ИНЛАЙН-СТИЛИ (выполняются мгновенно)
    ========================================== -->
    <style>
        :root {
  /* Перебиваем системные переменные Telegram на чистый черный */
  --tg-theme-bg-color: #000000 !important;
  --tg-theme-secondary-bg-color: #000000 !important;
  --tg-theme-header-bg-color: #000000 !important;
        }
        /* Полный сброс и чёрный фон с первой миллисекунды */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            background: #000000 ;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
        }

        /* Скрываем всё, что может мелькнуть до загрузки */
        #app-screen {
            display: none ;
        }
        #guest-screen {
            display: none ;
        }
        #header {
            display: none ;
        }

        /* Сплеш показываем сразу */
        #splash-screen {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  background: #000;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 99999;
  transition: opacity 0.35s ease;
}
#splash-screen.hidden {
  opacity: 0;
  pointer-events: none;
}
.splash-owl {
  width: 96px;
  height: 96px;
  opacity: 0.85;
}

        /* ==========================================
           👁️ ОПТИМИЗИРОВАННАЯ АНИМАЦИЯ МОРГАНИЯ СОВЫ
        ========================================== -->
        @keyframes tripleBlink {
            /* 0% - 70%: Глаза полностью открыты */
            0%, 70%, 100% { transform: scaleY(1); }
            
            /* Фаза 1: «Хлоп» (первое одиночное моргание) */
            73% { transform: scaleY(0.05); }
            76% { transform: scaleY(1); }
            
            /* Пауза между хлопками */
            80% { transform: scaleY(1); }
            
            /* Фаза 2: «Хлоп» (первая половина двойного моргания) */
            83% { transform: scaleY(0.05); }
            86% { transform: scaleY(1); }
            
            /* Микро-пауза */
            88% { transform: scaleY(1); }
            
            /* Фаза 3: «Хлоп» (вторая половина двойного моргания) */
            91% { transform: scaleY(0.05); }
            94% { transform: scaleY(1); }
        }

        /* Привязка анимации и фиксация центров трансформации отдельно для каждого глаза */
        .owl-eye-left {
            transform-origin: 48px 40px;
            animation: tripleBlink 1s infinite ease-in-out;
        }
        .owl-eye-right {
            transform-origin: 72px 40px;
            animation: tripleBlink 1s infinite ease-in-out;
        }

    </style>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- ==========================================
         ✅ КРИТИЧЕСКИЙ СКРИПТ (выполняется ДО рендеринга)
         Делает хедер чёрным мгновенно
    ========================================== -->
    <script>
        (function() {
            try {
                const tg = window.Telegram?.WebApp;
                if (tg) {
                    // Мгновенно делаем хедер чёрным
                    tg.setHeaderColor('#000000');
                    tg.setBackgroundColor('#000000');
                    tg.ready();
                    tg.expand();

                    // Сохраняем в глобальной переменной для дальнейшего использования
                    window.__tg = tg;
                    console.log('✅ Telegram WebApp настроен (чёрный хедер)');
                }
            } catch (e) {
                console.warn('⚠️ Ошибка настройки Telegram:', e);
            }
        })();
    </script>
    <!-- ==========================================
         ВНЕШНИЕ СТИЛИ (загружаются асинхронно)
    ========================================== -->
    <link rel="stylesheet" href="/src/core/core.css" media="print" onload="this.media='all'">
    <!-- ==========================================
         ВНЕШНИЕ БИБЛИОТЕКИ
    ========================================== -->
    <!-- Версии зафиксированы: «последняя» версия с CDN может сломать приложение или
         подменить код без нашего ведома. DOMPurify 3.2.4 — с исправлениями обходов очистки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js" defer></script>
    <script src="https://unpkg.com/lucide@0.460.0" defer></script>
    <!-- ✅ Eruda загружается статически, но НЕ инициализируется автоматически -->
    <!-- Инициализация происходит в app.ts после проверки роли -->
    <script src="https://cdn.jsdelivr.net/npm/eruda@3.4.1/eruda.min.js"></script>
</head>
<body>

<!-- ==========================================
     ✅ СПЛЕШ-ЭКРАН (встроен в HTML, появляется мгновенно)
========================================== -->
<!-- SPLASH: простая серая сова -->
<div id="splash-screen">
  <svg class="splash-owl" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <!-- тело -->
    <ellipse cx="60" cy="68" rx="38" ry="36" fill="#6B6B6B"/>
    <!-- голова -->
    <circle cx="60" cy="42" r="28" fill="#7A7A7A"/>
    <!-- ушки -->
    <path d="M38 28 L32 12 L48 24 Z" fill="#7A7A7A"/>
    <path d="M82 28 L88 12 L72 24 Z" fill="#7A7A7A"/>
    
    <!-- Левый глаз (сгруппирован для анимации вокруг центра X=48, Y=40) -->
    <g class="owl-eye-left">
      <circle cx="48" cy="40" r="12" fill="#4A4A4A"/>
      <circle cx="48" cy="40" r="5" fill="#2A2A2A"/>
      <circle cx="45" cy="37" r="2" fill="#9A9A9A"/>
    </g>
    
    <!-- Правый глаз (сгруппирован для анимации вокруг центра X=72, Y=40) -->
    <g class="owl-eye-right">
      <circle cx="72" cy="40" r="12" fill="#4A4A4A"/>
      <circle cx="72" cy="40" r="5" fill="#2A2A2A"/>
      <circle cx="69" cy="37" r="2" fill="#9A9A9A"/>
    </g>
    
    <!-- клюв -->
    <path d="M60 46 L54 54 L66 54 Z" fill="#5A5A5A"/>
    <!-- крылья намёк -->
    <ellipse cx="28" cy="70" rx="10" ry="22" fill="#5A5A5A" opacity="0.7"/>
    <ellipse cx="92" cy="70" rx="10" ry="22" fill="#5A5A5A" opacity="0.7"/>
  </svg>
</div>

<!-- ==========================================
     ОСТАЛЬНОЙ КОНТЕНТ (скрыт до загрузки)
========================================== -->

<!-- HEADER -->
<div id="header" class="hidden">
    <div class="header-glass">
        <img id="user-avatar" src="" alt="Аватар" class="header-avatar" onclick="window.openDrawer()">
        <div class="coins-badge" onclick="window.goToTasks()">
            <span class="coin-icon">🪙</span>
            <span class="coin-amount" id="header-coins-amount">0</span>
        </div>
    </div>
    <div class="header-center" id="header-center"></div>
    <div class="header-right" id="header-right"></div>
</div>

<!-- GUEST SCREEN -->
<div id="guest-screen" class="hidden">
    <h1 id="error-title">Доступ ограничен</h1>
    <p id="joke-text"></p>
    <a href="https://t.me" class="btn" style="text-decoration:none; display:inline-block;"></a>
</div>

<!-- APP SCREEN -->
<div id="app-screen" style="display:none;"></div>

<!-- УНИВЕРСАЛЬНАЯ МОДАЛКА -->
<div id="universal-modal" class="hidden" style="display:none;">
    <div class="modal-overlay" id="modal-overlay">
        <div class="modal-content" id="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">Заголовок</h3>
                <button id="modal-close" class="modal-close-btn">
                    <i data-lucide="x" style="width:24px;height:24px;"></i>
                </button>
            </div>
            <div id="modal-body" class="modal-body"></div>
            <div id="modal-footer" class="modal-footer hidden"></div>
        </div>
    </div>
</div>

<!-- ==========================================
     SUPABASE CLIENT
========================================== -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>

<!-- ==========================================
     ТОЧКА ВХОДА (TypeScript)
========================================== -->
<script type="module" src="/src/core/config.ts"></script>
<script type="module" src="/src/core/locale.ts"></script>
<script type="module" src="/src/core/app.ts"></script>

<!-- ==========================================
     LUCIDE ИНИЦИАЛИЗАЦИЯ
========================================== -->
<script>
    setTimeout(function() {
        if (typeof lucide !== 'undefined') {
            try {
                lucide.createIcons();
                console.log('✅ Lucide иконки созданы');
            } catch(e) {
                console.warn('⚠️ Ошибка создания иконок:', e);
            }
        }
    }, 500);
</script>

</body>
</html>
